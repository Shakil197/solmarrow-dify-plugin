identity:
  author: solmarrow
  name: solmarrow
  label:
    en_US: SolMarrow
  description:
    en_US: Draft, schedule and track social media posts on 19 networks.
  icon: icon.svg
  icon_dark: icon-dark.svg
  tags:
    - social
    - productivity
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: SolMarrow API key
    placeholder:
      en_US: smk_...
    help:
      en_US: Create one in SolMarrow under Settings → Apps and AI agents → API keys. It reaches one workspace.
    url: https://app.solmarrow.com/settings
tools:
  - tools/list_workspaces.yaml
  - tools/list_accounts.yaml
  - tools/create_post.yaml
  - tools/list_posts.yaml
  - tools/get_post.yaml
  - tools/get_analytics.yaml
  - tools/upload_media_from_url.yaml
extra:
  python:
    source: provider/solmarrow.py
